[package]
name = "tol-compress"
description = "Tolerance-bounded compression of spatial coordinate data, for storing geometry in the smallest space that still guarantees a round-trip accuracy."
license = "MIT OR Apache-2.0"
# Deliberately NOT `version.workspace = true`. This crate releases on its own cadence, under its
# own `tol-compress-vX.Y.Z` tags, independent of the engeom version.
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/mattj23/engeom"
documentation = "https://docs.rs/tol-compress"
keywords = ["compression", "mesh", "geometry", "metrology", "serialization"]
categories = ["compression", "encoding", "science"]
# Benchmark fixtures are for developing the format, not for using it. Keeping them out of the
# published package means downloads stay small.
exclude = ["tests/data/*"]

[features]
default = []
# Generators for the benchmark corpus. Dependency-free, but test scaffolding rather than format
# code, so it stays off unless asked for.
corpus = []

[dependencies]

[dev-dependencies]

[[example]]
name = "size_report"
required-features = ["corpus"]

[package]
name = "py-engeom"
version.workspace = true
edition.workspace = true
# The PyO3 binding crate is distributed through PyPI, never crates.io.
publish = false
# Not needed by any registry, but `cargo package --list` runs during `maturin sdist` and warns when
# these are absent, so filling them in keeps the sdist build output clean.
description = "Python bindings for the engeom engineering metrology geometry library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattj23/engeom"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "engeom"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.1", features = ["abi3-py38", "extension-module"] }
numpy = "0.28.0"
engeom = { path = "../engeom", features = ["stl", "ply"] }
parry3d-f64 = { workspace = true, features = ["serde-serialize"] }
parry2d-f64 = { workspace = true, features = ["serde-serialize"] }
rmp-serde = "1.3.0"

